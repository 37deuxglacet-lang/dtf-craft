# Base PhotoCraft de DTF Craft.
#
# L'historique Git de DTF Craft démarre par un import de PhotoCraft en un seul commit : il n'est pas
# relié à celui de PhotoCraft. Ce fichier enregistre donc l'état de PhotoCraft dont DTF Craft est
# parti. scripts/dtf-sync-photocraft.sh s'en sert comme ancêtre commun pour fusionner une nouvelle
# version de PhotoCraft (fusion à trois voies), puis le met à jour.

[photocraft]
repository = "https://github.com/storytold/photocraft"
# Commit PhotoCraft de base (main du 14/10/2026, entre v0.8.2 et v0.9.0).
commit = "ed7df56a2455375240959bae6e5273a71d858d84"
version = "0.8.2+"

# Fichiers PhotoCraft supprimés dans DTF Craft : une fusion ne doit pas les réintroduire.
removed = [
    ".github/workflows/ci.yml",
    ".github/workflows/docs.yml",
    ".github/workflows/freebsd.yml",
    ".github/workflows/packaging-lint.yml",
    ".github/workflows/perf-nightly.yml",
    ".github/workflows/release.yml",
    ".github/workflows/windows-arm64.yml",
]
