name: Bench V1.0 vs 1.1

# Temporary: times the DTF commands of the CLI built from main (V1.0.x) and from the PhotoCraft
# 0.23.1 branch, both on the same runner, runs alternated.
on:
  push:
    branches: ["bench/**"]

permissions:
  contents: read

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          path: benchfiles
      - uses: actions/checkout@v4
        with:
          ref: 426b3974175537d090ca8433f392c84315fdfdfc
          path: a
      - uses: actions/checkout@v4
        with:
          ref: 16638e590cb7d3288c3706f67e98473c81661b22
          path: b
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build V1.0 CLI
        working-directory: a
        run: cargo build --release -p photocraft-cli
      - name: Build 1.1 CLI
        working-directory: b
        run: cargo build --release -p photocraft-cli
      - name: Time the commands (alternated)
        shell: pwsh
        run: |
          (Get-CimInstance Win32_Processor).Name
          "CPU: $env:NUMBER_OF_PROCESSORS logical"
          $img = "benchfiles\bench\visuel.png"
          $logo = "benchfiles\bench\logo.png"
          $cases = @(
            @{ n = "upscale x2 900x600"; f = $img; a = @("--cmd", "dtf.upscale", "--params", '{"scale":"2"}') },
            @{ n = "optimizeForVectorization"; f = $logo; a = @("--cmd", "dtf.optimizeForVectorization") }
          )
          foreach ($c in $cases) {
            $res = @{ a = @(); b = @() }
            for ($i = 0; $i -lt 3; $i++) {
              foreach ($v in @("a", "b")) {
                $cli = "$v\target\release\photocraft-cli.exe"
                $t = Measure-Command { & $cli run $c.f @($c.a) --out "$env:RUNNER_TEMP\o.png" *> "$env:RUNNER_TEMP\log-$v.txt" }
                $res[$v] += [math]::Round($t.TotalSeconds, 1)
              }
            }
            "::notice title=$($c.n)::V1.0 $($res.a -join ' / ') s | 1.1 $($res.b -join ' / ') s"
            Get-Content "$env:RUNNER_TEMP\log-a.txt" -TotalCount 1
            Get-Content "$env:RUNNER_TEMP\log-b.txt" -TotalCount 1
          }
