name: DTF Craft (Windows)

# Builds the DTF Craft desktop app and CLI for Windows x64.
# The repository is public: the official zip is NOT attached to GitHub releases. It is kept as a
# 1-day workflow artifact and, on tags or manual runs, uploaded to the Nuxit hosting (FTPS) when the
# NUXIT_FTP_* secrets are set.
# V2.0: the Screen Printing Separations module is sold by subscription and its code is private
# (37deuxglacet-lang/dtf-craft-pro). With the DTF_PRO_TOKEN secret (read-only access to that
# repository), the official build replaces the public placeholder crates/separations with it.
# Without the secret (forks, public builds), the placeholder is built.
on:
  push:
    branches: [main, dtf-craft, v2-separations]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      upload_name:
        description: "Nom de version pour l'envoi sur Nuxit (ex. 1.0 ; vide = pas d'envoi)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TERM_COLOR: always
      NUXIT_FTP_HOST: ${{ secrets.NUXIT_FTP_HOST }}
      NUXIT_FTP_USER: ${{ secrets.NUXIT_FTP_USER }}
      NUXIT_FTP_PASSWORD: ${{ secrets.NUXIT_FTP_PASSWORD }}
      NUXIT_FTP_DIR: ${{ secrets.NUXIT_FTP_DIR }}
      # The start screen's Pixabay illustration: the API key, built into the app (empty: no illustration).
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      DTF_PRO_TOKEN: ${{ secrets.DTF_PRO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Private module (dtf-craft-pro)
        if: env.DTF_PRO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: 37deuxglacet-lang/dtf-craft-pro
          token: ${{ secrets.DTF_PRO_TOKEN }}
          path: _pro
          persist-credentials: false
      - name: Use the private module
        if: env.DTF_PRO_TOKEN != ''
        shell: pwsh
        run: |
          if (-not (Test-Path _pro/separations/Cargo.toml)) { throw "dtf-craft-pro: separations/Cargo.toml manquant" }
          Remove-Item -Recurse -Force crates/separations
          Copy-Item -Recurse _pro/separations crates/separations
          Remove-Item -Recurse -Force _pro
          Write-Host "::notice title=Module Séparations::module privé (version officielle)"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (DTF)
        run: |
          cargo test --release -p photocraft-algo --lib -- dtf upscale
          cargo test --release -p photocraft-engine --lib dtf_cmds
          cargo test --release -p photocraft-separations
      - name: Build
        run: cargo build --release -p photocraft -p photocraft-cli
      - name: Package
        shell: pwsh
        run: |
          $out = "dtf-craft-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/photocraft.exe "$out/DTF Craft.exe"
          Copy-Item target/release/photocraft-cli.exe "$out/dtfcraft-cli.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, MODIFICATIONS.md $out
          Copy-Item crates/algo/models/LICENSE "$out/LICENSE-Real-ESRGAN.txt"
          Copy-Item DTF-CRAFT.md "$out/LISEZ-MOI.md"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
      - name: Check (SHA-256, Microsoft Defender)
        shell: pwsh
        continue-on-error: true
        run: |
          # Results as annotations (readable through the API, beside the run).
          foreach ($f in "dtf-craft-windows-x64/DTF Craft.exe", "dtf-craft-windows-x64/dtfcraft-cli.exe", "dtf-craft-windows-x64.zip") {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash
            Write-Host "::notice title=SHA-256::$f $h"
          }
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $u = (& $mp -SignatureUpdate 2>&1 | Out-String).Trim() -replace "`r?`n", " | "
          Write-Host "::notice title=Defender update::$u"
          foreach ($t in "$PWD\dtf-craft-windows-x64", "$PWD\dtf-craft-windows-x64.zip") {
            $r = (& $mp -Scan -ScanType 3 -File $t -DisableRemediation 2>&1 | Out-String).Trim() -replace "`r?`n", " | "
            Write-Host "::notice title=Defender scan (exit $LASTEXITCODE)::$t $r"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dtf-craft-windows-x64
          path: dtf-craft-windows-x64.zip
          retention-days: 1
      - name: Upload to Nuxit (tags or manual run)
        if: env.NUXIT_FTP_HOST != '' && (startsWith(github.ref, 'refs/tags/') || inputs.upload_name != '')
        shell: pwsh
        run: |
          $name = if ("${{ inputs.upload_name }}") { "${{ inputs.upload_name }}" } else { "${{ github.ref_name }}" }
          curl.exe --fail --ssl-reqd --ftp-create-dirs `
            --user "${env:NUXIT_FTP_USER}:${env:NUXIT_FTP_PASSWORD}" `
            -T dtf-craft-windows-x64.zip `
            "ftp://${env:NUXIT_FTP_HOST}/${env:NUXIT_FTP_DIR}/dtf-craft-windows-x64-$name.zip"
