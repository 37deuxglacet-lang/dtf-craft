name: DTF Craft (Windows)

# Builds the DTF Craft desktop app and CLI for Windows x64.
# The repository is public: the official zip is NOT attached to GitHub releases. It is kept as a
# 1-day workflow artifact and, on tags or manual runs, uploaded to the Nuxit hosting (FTPS) when the
# NUXIT_FTP_* secrets are set.
on:
  push:
    branches: [main, dtf-craft]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      upload_name:
        description: "Nom de version pour l'envoi sur Nuxit (ex. 1.0 ; vide = pas d'envoi)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TERM_COLOR: always
      NUXIT_FTP_HOST: ${{ secrets.NUXIT_FTP_HOST }}
      NUXIT_FTP_USER: ${{ secrets.NUXIT_FTP_USER }}
      NUXIT_FTP_PASSWORD: ${{ secrets.NUXIT_FTP_PASSWORD }}
      NUXIT_FTP_DIR: ${{ secrets.NUXIT_FTP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (DTF)
        run: |
          cargo test --release -p photocraft-algo --lib -- dtf upscale
          cargo test --release -p photocraft-engine --lib dtf_cmds
      - name: Build
        run: cargo build --release -p photocraft -p photocraft-cli
      - name: Package
        shell: pwsh
        run: |
          $out = "dtf-craft-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/photocraft.exe "$out/DTF Craft.exe"
          Copy-Item target/release/photocraft-cli.exe "$out/dtfcraft-cli.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, MODIFICATIONS.md $out
          Copy-Item crates/algo/models/LICENSE "$out/LICENSE-Real-ESRGAN.txt"
          Copy-Item DTF-CRAFT.md "$out/LISEZ-MOI.md"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
      - name: Check (SHA-256, Microsoft Defender)
        shell: pwsh
        continue-on-error: true
        run: |
          Get-FileHash -Algorithm SHA256 "dtf-craft-windows-x64/DTF Craft.exe", "dtf-craft-windows-x64/dtfcraft-cli.exe", "dtf-craft-windows-x64.zip" | Format-List Path, Hash
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate
          & $mp -Scan -ScanType 3 -File "$PWD\dtf-craft-windows-x64" -DisableRemediation
          Write-Host "Defender exit code: $LASTEXITCODE (0 = nothing found, 2 = threat found)"
          & $mp -Scan -ScanType 3 -File "$PWD\dtf-craft-windows-x64.zip" -DisableRemediation
          Write-Host "Defender exit code (zip): $LASTEXITCODE"
      - uses: actions/upload-artifact@v4
        with:
          name: dtf-craft-windows-x64
          path: dtf-craft-windows-x64.zip
          retention-days: 1
      - name: Upload to Nuxit (tags or manual run)
        if: env.NUXIT_FTP_HOST != '' && (startsWith(github.ref, 'refs/tags/') || inputs.upload_name != '')
        shell: pwsh
        run: |
          $name = if ("${{ inputs.upload_name }}") { "${{ inputs.upload_name }}" } else { "${{ github.ref_name }}" }
          curl.exe --fail --ssl-reqd --ftp-create-dirs `
            --user "${env:NUXIT_FTP_USER}:${env:NUXIT_FTP_PASSWORD}" `
            -T dtf-craft-windows-x64.zip `
            "ftp://${env:NUXIT_FTP_HOST}/${env:NUXIT_FTP_DIR}/dtf-craft-windows-x64-$name.zip"
